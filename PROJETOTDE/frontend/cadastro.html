<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taskly | Cadastro</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1><i class="bi bi-check2-square"></i> Taskly</h1>
    </header>

    <main>
        <div class="form-container">
            <h2>Criar Conta</h2>
            <form id="formCadastro">
                <div class="campo-grupo">
                    <label for="nome"><i class="bi bi-person"></i> Nome:</label>
                    <input type="text" id="nome" name="nome" placeholder="Seu nome completo" required>
                </div>
                <div class="campo-grupo">
                    <label for="email"><i class="bi bi-envelope"></i> Email:</label>
                    <input type="email" id="email" name="email" placeholder="seu@email.com" required>
                </div>
                <div class="campo-grupo">
                    <label for="senha"><i class="bi bi-lock"></i> Senha:</label>
                    <input type="password" id="senha" name="senha" placeholder="Crie uma senha" required>
                </div>
                <div class="campo-grupo">
                    <label for="telefone"><i class="bi bi-telephone"></i> Telefone:</label>
                    <input type="tel" id="telefone" name="telefone" placeholder="(11) 99999-9999" required>
                </div>
                <button type="submit" class="botao-principal">
                    <i class="bi bi-person-plus"></i> Cadastrar
                </button>
            </form>
            <p style="text-align: center; margin-top: 15px;">
                Já tem conta? <a href="login.html" style="color: var(--cor-primaria);">Faça login</a>
            </p>
        </div>
    </main>

    <script src="js/cadastro.js" defer></script>
</body>
</html>
