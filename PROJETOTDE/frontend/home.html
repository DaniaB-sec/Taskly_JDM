<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taskly | Minhas Tarefas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1><i class="bi bi-check2-square"></i> Taskly</h1>
        <div style="display: flex; align-items: center; gap: 10px;">
            <span>Olá, <strong id="nomeUsuario">Usuário</strong>!</span>
            <button onclick="window.location.href='dashboard.html'" class="botao-secundario" style="padding: 5px 15px; color: white; border-color: white;">
                <i class="bi bi-gear"></i> Categorias e Perfil
            </button>
            <button id="btnLogout" class="botao-secundario" style="padding: 5px 15px; color: white; border-color: white;">
                <i class="bi bi-box-arrow-right"></i> Sair
            </button>
        </div>
    </header>

    <main>
        <div class="saudacao-topo">
            <h2>Minhas Tarefas</h2>
            <div style="display: flex; gap: 10px; align-items: center;">
                <select id="filtroCategoria" style="padding: 6px 10px; border-radius: 8px; border: 1px solid #ccc;">
                    <option value="">Todas as categorias</option>
                </select>
                <span id="contadorTarefas" style="background: var(--cor-primaria); color: white; padding: 5px 10px; border-radius: 20px; font-size: 0.9rem;">
                    0 tarefas
                </span>
            </div>
        </div>

        <div class="area-adicionar-tarefa">
            <input type="text" id="inputNovaTarefa" placeholder="O que precisa ser feito hoje?">
            <select id="selectCategoriaTarefa" style="padding: 10px; border: 1px solid #ccc; border-radius: 8px;">
                <option value="">Sem categoria</option>
            </select>
            <button id="btnAdicionarTarefa" class="botao-principal" style="width: auto;">
                <i class="bi bi-plus-lg"></i> Adicionar
            </button>
        </div>

        <ul class="lista-tarefas" id="listaTarefas">
        </ul>
    </main>

    <script src="js/home.js"></script>
</body>
</html>
