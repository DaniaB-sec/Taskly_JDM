<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taskly | Gerenciar Categorias e Perfil</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1><i class="bi bi-check2-square"></i> Taskly</h1>
        <div style="display: flex; align-items: center; gap: 10px;">
            <button onclick="window.location.href='home.html'" class="botao-secundario" style="padding: 5px 15px; color: white; border-color: white;">
                <i class="bi bi-list-task"></i> Voltar para Tarefas
            </button>
        </div>
    </header>

    <main>
        <div class="saudacao-topo">
            <h2>Gerenciar Categorias</h2>
        </div>

        <div class="area-adicionar-tarefa">
            <input type="text" id="inputNovaCategoria" placeholder="Nome da nova categoria (ex: Faculdade, Saúde)">
            <button id="btnAdicionarCategoria" class="botao-principal" style="width: auto;">
                <i class="bi bi-plus-lg"></i> Criar Categoria
            </button>
        </div>

        <ul class="lista-tarefas" id="listaCategorias" style="margin-bottom: 40px;">
        </ul>

        <div class="form-container" style="max-width: 100%; margin: 0;">
            <h2 style="text-align: left;">Meu Perfil (Editar / Excluir Conta)</h2>
            <form id="formPerfil">
                <div class="campo-grupo">
                    <label for="perfilNome">Nome:</label>
                    <input type="text" id="perfilNome" name="nome" required>
                </div>
                <div class="campo-grupo">
                    <label for="perfilEmail">Email:</label>
                    <input type="email" id="perfilEmail" name="email" required>
                </div>
                <div class="campo-grupo">
                    <label for="perfilTelefone">Telefone:</label>
                    <input type="tel" id="perfilTelefone" name="telefone" required>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button type="submit" class="botao-principal">
                        <i class="bi bi-save"></i> Salvar Alterações
                    </button>
                    <button type="button" id="btnExcluirConta" class="botao-secundario" style="border-color: var(--cor-erro); color: var(--cor-erro);">
                        <i class="bi bi-trash"></i> Excluir Conta
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script src="js/dashboard.js"></script>
</body>
</html>
